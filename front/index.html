<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Video Range</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f9;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        video {
            width: 100%;
            border-radius: 4px;
            background: #000;
            margin-top: 15px;
        }

        .logs {
            margin-top: 20px;
            background: #222;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Проверка частичной загрузки видео (HTTP Range)</h2>

    <video id="myVideo" controls>
        <source src="http://localhost:8001/api/stream?filename=541d5675-ed9a-4c1b-b296-60b169eea9aa.mp4" type="video/mp4">
        Ваш браузер не поддерживает тег video.
    </video>

    <h3>Лог запросов браузера:</h3>
    <div id="log" class="logs">Ожидание воспроизведения...</div>
</div>

<script>
    const video = document.getElementById('myVideo');
    const logDiv = document.getElementById('log');

    function log(message) {
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${time}] ${message}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Отслеживаем загрузку метаданных (первый запрос браузера)
    video.addEventListener('loadedmetadata', () => {
        log('✅ Метаданные загружены. Длительность: ' + video.duration.toFixed(2) + ' сек.');
    });

    // Отслеживаем буферизацию при перемотке
    video.addEventListener('seeking', () => {
        log('🔄 Перемотка... Браузер делает новый Range-запрос.');
    });

    video.addEventListener('playing', () => {
        log('▶️ Воспроизведение началось.');
    });
</script>

</body>
</html>
