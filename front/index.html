<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Video Range</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f9;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        video {
            width: 100%;
            border-radius: 4px;
            background: #000;
            margin-top: 15px;
        }

        .logs {
            margin-top: 20px;
            background: #222;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
        #list {
            display: grid;
        }
        #list > button {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Проверка частичной загрузки видео (HTTP Range)</h2>
    <div id="list" class="list"></div>

    <video id="myVideo" controls>
        <source src="" type="video/mp4">
        Ваш браузер не поддерживает тег video.
    </video>

    <h3>Лог запросов браузера:</h3>
    <div id="log" class="logs">Ожидание воспроизведения...</div>
</div>

<script>
    const video = document.getElementById('myVideo');
    const logDiv = document.getElementById('log');
    const list = document.getElementById('list');
    let currentFile;

    async function getFiles() {
        const filesRequest = await fetch('http://localhost:8001/api/files');
        const names = await filesRequest.json();

        list.innerHTML = '';
        names.forEach((file) => {
            list.innerHTML += `<button value="${file}" onclick="openVideo(this.value)">${file}</button>\n`
        });
    }

    function log(message) {
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${time}] ${message}<br>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Отслеживаем загрузку метаданных (первый запрос браузера)
    video.addEventListener('loadedmetadata', async () => {
        log('✅ Метаданные загружены. Длительность: ' + video.duration.toFixed(2) + ' сек.');
    });

    video.addEventListener('timeupdate', async () => {
        if (video.currentTime.toFixed(0) % 5 === 0) {
            await fetch('http://localhost:8001/api/set-prog', {
                method: 'POST',
                body: JSON.stringify({filename: currentFile, progress: video.currentTime}),
                headers: {
                    'Content-Type': 'application/json',
                }
            });
        }
    })

    // Отслеживаем буферизацию при перемотке
    video.addEventListener('seeking', () => {
        log('🔄 Перемотка... Браузер делает новый Range-запрос.');
    });

    video.addEventListener('playing', () => {
        log('▶️ Воспроизведение началось.');
    });

    async function openVideo(filename) {
        video.src = 'http://localhost:8001/api/stream?filename=' + filename;
        currentFile = filename;

        const progressRequest = await fetch('http://localhost:8001/api/get-prog?filename=' + filename);
        const progress = await progressRequest.json();

        if (progress) {
            video.src += `#t=${progress}`;
        }
    }
    (async () => await getFiles())();
</script>

</body>
</html>
