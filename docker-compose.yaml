services:
  back:
    build: .
    container_name: streaming-back
    ports:
      - "8001:8001"
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

  minio:
    image: "minio/minio"
    container_name: streaming-minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:latest
    container_name: streaming-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
volumes:
  minio_data:
  redis_data: