<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Video Range</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f4f9;
            color: #333;
        }

        .container {
            display: flex;
            background: #fff;
            width: 1000px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        video {
            display: none;
            width: 100%;
            height: 530px;
            border-radius: 7px;
            background: #000;
            margin-top: 15px;
        }

        #list {
            display: block;
            margin-right: 20px;
            padding: 10px;
            width: 300px;
            height: auto;
            border-right: 1px #333 solid;
        }
        #list > button {
            height: 20px;
            margin-top: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: auto;
        }

        .upload-form {
            margin-top: 50px;
            display: block;
            justify-content: center;
        }
        .upload-form > form {
            width: 400px;
            height: 100px;
            display: grid;
            align-items: center;
            justify-content: center;
            margin: auto;

            border: 1px solid lightgray;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="list" class="list">
        <h3>Список файлов для просмотра</h3>
    </div>
    <div class="content">
        <h2>Проверка частичной загрузки видео (HTTP Range)</h2>

        <p id="filename"></p>
        <video id="myVideo" controls>
            <source src="" type="video/mp4">
            Ваш браузер не поддерживает тег video.
        </video>
        <div class="upload-form">
            <form id="sendForm" action="http://localhost:8001/api/upload-file" method="post" enctype="multipart/form-data">
                <label for="file-picker">Выберите видео для загрузки:</label>
                <input type="file" name="file" id="file-picker" accept=".mp4,.avi',.mkv" required>

                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
</div>


<script>
    const videoName = document.getElementById('filename');
    const video = document.getElementById('myVideo');
    const list = document.getElementById('list');
    let currentFile;

    async function getFiles() {
        const filesRequest = await fetch('http://localhost:8001/api/files');
        const names = await filesRequest.json();
        if (names && names.length > 0) {
            names.forEach((file) => {
                list.innerHTML += `<button value="${file}" onclick="openVideo(this.value)">${file}</button>\n`
            });
        }
    }

    video.addEventListener('timeupdate', async () => {
        if (video.currentTime.toFixed(0) % 5 === 0) {
            await fetch('http://localhost:8001/api/set-prog', {
                method: 'POST',
                body: JSON.stringify({filename: currentFile, progress: video.currentTime}),
                headers: {
                    'Content-Type': 'application/json',
                }
            });
        }
    })

    async function openVideo(filename) {
        video.style.display = 'block';
        video.src = 'http://localhost:8001/api/stream?filename=' + filename;
        currentFile = filename;
        videoName.innerText = filename;

        const progressRequest = await fetch('http://localhost:8001/api/get-prog?filename=' + filename);
        const progress = await progressRequest.json();

        if (progress) {
            video.src += `#t=${progress}`;
        }
    }

    document.getElementById('sendForm').addEventListener('submit', async (event) => {
        event.preventDefault(); // 1. Останавливаем стандартную перезагрузку

        const formData = new FormData(event.target);

        try {
            // 2. Отправляем данные на сервер
            const response = await fetch('/api/upload-file', {
                method: 'POST',
                body: formData
            });

            // 3. Если сервер ответил успешно, делаем редирект
            if (response.ok) {
                window.location.href = '/index.html';
            } else {
                alert('Ошибка при отправке данных');
            }
        } catch (error) {
            console.error('Ошибка сети:', error);
        }
    });
    (async () => await getFiles())();
</script>

</body>
</html>
